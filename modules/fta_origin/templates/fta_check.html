<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EPA/FTA 特恵税率チェック — AI Trade Management</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; color: #1a1a2e; }
  .topbar { background: #1a1a2e; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  .topbar h1 { font-size: 1.1rem; font-weight: 600; }
  .topbar a { color: #90caf9; font-size: 0.85rem; text-decoration: none; }
  .container { max-width: 960px; margin: 24px auto; padding: 0 20px 40px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; margin-bottom: 20px; }
  .card-header { padding: 14px 20px; border-bottom: 1px solid #f0f0f0; }
  .card-header h2 { font-size: 0.95rem; font-weight: 600; }
  .card-body { padding: 20px; }
  .field-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
  .field { flex: 1; min-width: 160px; }
  .field label { display: block; font-size: 0.82rem; font-weight: 600; color: #555; margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.88rem;
  }
  .field input:focus, .field select:focus { outline: none; border-color: #1976d2; }
  .btn { padding: 8px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 600; }
  .btn-primary { background: #1976d2; color: #fff; }
  .btn-primary:hover { background: #1565c0; }
  .btn-seed { background: #2e7d32; color: #fff; }
  .hint { font-size: 0.76rem; color: #888; margin-top: 3px; }
  /* Result */
  .result-box { margin-top: 20px; }
  .summary-banner {
    background: #e8f5e9; border-left: 4px solid #2e7d32; border-radius: 6px;
    padding: 12px 16px; margin-bottom: 16px; font-size: 0.9rem; font-weight: 500; color: #1b5e20;
  }
  .summary-banner.no-fta {
    background: #fff3e0; border-left-color: #e65100; color: #bf360c;
  }
  .summary-banner.no-data {
    background: #f5f5f5; border-left-color: #9e9e9e; color: #555;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  th { background: #f5f7fa; padding: 9px 12px; text-align: left; font-weight: 600; color: #555; border-bottom: 1px solid #e0e0e0; }
  td { padding: 9px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #f9faff; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; }
  .badge-A { background: #e8f5e9; color: #2e7d32; }
  .badge-B { background: #e3f2fd; color: #1565c0; }
  .badge-C { background: #fce4ec; color: #c62828; }
  .badge-D { background: #fff3e0; color: #e65100; }
  .badge-TRQ { background: #f3e5f5; color: #6a1b9a; }
  .rate-good { color: #2e7d32; font-weight: 700; }
  .rate-ok { color: #1565c0; font-weight: 600; }
  .rate-neutral { color: #555; }
  .best-badge { background: #ffd700; color: #333; padding: 1px 6px; border-radius: 3px; font-size: 0.72rem; font-weight: 700; margin-left: 6px; }
  /* Agreement list */
  .agr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .agr-card { background: #f9f9f9; border-radius: 8px; border: 1px solid #e0e0e0; padding: 12px 14px; font-size: 0.84rem; }
  .agr-card .agr-code { font-weight: 700; color: #1976d2; font-size: 0.9rem; }
  .agr-card .agr-name { color: #333; margin-top: 2px; }
  .agr-card .agr-date { font-size: 0.76rem; color: #888; margin-top: 4px; }
  .agr-card .agr-partners { font-size: 0.75rem; color: #555; margin-top: 4px; line-height: 1.5; }
  .status-active { color: #2e7d32; font-weight: 600; }
  .status-provisional { color: #e65100; }
  /* Loading */
  .loading { text-align: center; color: #888; padding: 24px; }
</style>
</head>
<body>

<div class="topbar">
  <h1>🌐 EPA/FTA 特恵税率チェック</h1>
  <a href="/ui">← ポータルへ戻る</a>
</div>

<div class="container">

  <!-- 税率チェック -->
  <div class="card">
    <div class="card-header">
      <h2>特恵税率 照会</h2>
    </div>
    <div class="card-body">
      <div class="field-row">
        <div class="field">
          <label>HS コード</label>
          <input id="hsCode" type="text" placeholder="例: 8542.31" />
          <div class="hint">6桁・7桁どちらも可。ドット有無は問いません。</div>
        </div>
        <div class="field">
          <label>仕向地国（ISO 2文字）</label>
          <input id="destCountry" type="text" placeholder="例: CN, DE, US" maxlength="3" />
        </div>
        <div class="field" style="max-width:90px;">
          <label>原産国</label>
          <input id="originCountry" type="text" placeholder="JP" maxlength="3" value="JP" />
          <div class="hint">輸出元国コード</div>
        </div>
        <div class="field" style="max-width:100px;">
          <label>適用年</label>
          <select id="year">
            <option value="2024" selected>2024</option>
            <option value="2025">2025</option>
            <option value="2023">2023</option>
          </select>
        </div>
        <div style="padding-bottom:1px;">
          <button class="btn btn-primary" onclick="runCheck()">照会</button>
        </div>
      </div>

      <div id="checkResult"></div>
    </div>
  </div>

  <!-- 協定一覧 -->
  <div class="card">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
      <h2>締結済み EPA/FTA 一覧</h2>
      <button class="btn btn-seed" style="font-size:.8rem;padding:5px 12px;" onclick="seedData()">初期データ投入</button>
    </div>
    <div class="card-body">
      <div id="agreementList" class="loading">読み込み中...</div>
    </div>
  </div>

</div>

<script>
{% raw %}
function esc(s) {
  return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

const STAGING_LABEL = { A:'A（即時撤廃）', B:'B（段階削減）', C:'C（除外）', D:'D（特殊）', TRQ:'TRQ（関税割当）' };

async function runCheck() {
  const hs = document.getElementById('hsCode').value.trim();
  const dest = document.getElementById('destCountry').value.trim().toUpperCase();
  const origin = (document.getElementById('originCountry').value.trim().toUpperCase()) || 'JP';
  const year = document.getElementById('year').value;
  if (!hs || !dest) { alert('HS コードと仕向地国を入力してください'); return; }

  document.getElementById('checkResult').innerHTML = '<p class="loading">照会中...</p>';
  try {
    const r = await fetch(`/api/fta/check?hs_code=${encodeURIComponent(hs)}&destination_country=${encodeURIComponent(dest)}&origin_country=${encodeURIComponent(origin)}&year=${year}`);
    const d = await r.json();
    renderCheckResult(d);
  } catch(e) {
    document.getElementById('checkResult').innerHTML = `<p style="color:red;">エラー: ${esc(e.message)}</p>`;
  }
}

function renderCheckResult(d) {
  const hasRates = d.rates && d.rates.length > 0;
  const noFta = !d.applicable_agreements || !d.applicable_agreements.length;

  let bannerClass = hasRates ? '' : noFta ? 'no-fta' : 'no-data';
  let html = `<div class="result-box">
    <div class="summary-banner ${bannerClass}">
      🔍 HS: <strong>${esc(d.hs_code)}</strong> ／ 原産国: <strong>${esc(d.origin_country||'JP')}</strong> → 仕向地: <strong>${esc(d.destination_country)}</strong> ／ ${d.year}年<br/>
      ${esc(d.summary)}
    </div>`;

  if (d.applicable_agreements && d.applicable_agreements.length) {
    html += `<p style="font-size:.82rem;color:#555;margin-bottom:8px;">適用可能な協定: <strong>${d.applicable_agreements.join(', ')}</strong></p>`;
  }

  if (hasRates) {
    html += `<table>
      <thead><tr><th>協定</th><th>MFN 税率</th><th>特恵税率</th><th>削減カテゴリ</th><th>完全撤廃</th><th>備考</th></tr></thead>
      <tbody>`;
    const bestCode = d.best_rate ? d.best_rate.agreement_code : null;
    d.rates.forEach(rt => {
      const isBest = rt.agreement_code === bestCode;
      const rateClass = rt.preferential_rate_pct === 0 ? 'rate-good' : rt.preferential_rate_pct < (rt.mfn_rate_pct||99) ? 'rate-ok' : 'rate-neutral';
      const stagingClass = `badge-${rt.staging_category||'D'}`;
      html += `<tr>
        <td><strong>${esc(rt.agreement_code)}</strong>${isBest?'<span class="best-badge">最優遇</span>':''}</td>
        <td>${rt.mfn_rate_pct != null ? rt.mfn_rate_pct.toFixed(1)+'%' : '—'}</td>
        <td class="${rateClass}">${rt.preferential_rate_pct != null ? rt.preferential_rate_pct.toFixed(1)+'%' : '—'}</td>
        <td>${rt.staging_category ? `<span class="badge ${stagingClass}">${esc(STAGING_LABEL[rt.staging_category]||rt.staging_category)}</span>` : '—'}</td>
        <td>${rt.is_eliminated ? '✅ 撤廃済' : (rt.elimination_year ? rt.elimination_year+'年予定' : '—')}</td>
        <td style="font-size:.78rem;color:#555;">${esc(rt.notes||'')}</td>
      </tr>`;
    });
    html += `</tbody></table>`;
  } else if (!noFta) {
    html += `<p style="font-size:.84rem;color:#888;padding:12px 0;">この HS コードの税率データは未登録です。「初期データ投入」後、再度照会してください。</p>`;
  }

  html += `</div>`;
  document.getElementById('checkResult').innerHTML = html;
}

async function loadAgreements() {
  try {
    const r = await fetch('/api/fta/agreements');
    const items = await r.json();
    if (!items.length) {
      document.getElementById('agreementList').innerHTML =
        '<p style="color:#888;font-size:.85rem;">データなし。「初期データ投入」ボタンでシードデータを登録してください。</p>';
      return;
    }
    const html = `<div class="agr-grid">${items.map(a => `
      <div class="agr-card">
        <div style="display:flex;align-items:center;gap:6px;">
          <span class="agr-code">${esc(a.code)}</span>
          <span style="font-size:.7rem;background:#e3f2fd;color:#1565c0;border-radius:4px;padding:1px 5px;font-weight:600;">${esc(a.origin_country||'JP')} 発</span>
        </div>
        <div class="agr-name">${esc(a.name_ja)}</div>
        <div class="agr-date">
          発効: ${a.effective_date||'—'}
          <span class="status-${a.status}" style="margin-left:8px;">${{active:'● 発効中',provisional:'● 暫定適用',suspended:'× 停止'}[a.status]||a.status}</span>
        </div>
        <div class="agr-partners">相手国: ${a.partner_countries.slice(0,12).join(', ')}${a.partner_countries.length>12?` ほか${a.partner_countries.length-12}カ国`:''}</div>
        ${a.notes ? `<div style="font-size:.74rem;color:#666;margin-top:4px;">${esc(a.notes)}</div>` : ''}
      </div>`).join('')}</div>`;
    document.getElementById('agreementList').innerHTML = html;
  } catch(e) {
    document.getElementById('agreementList').innerHTML = '<p style="color:red;">読み込みエラー</p>';
  }
}

async function seedData() {
  if (!confirm('初期シードデータを投入しますか？（既存データは上書きされません）')) return;
  try {
    const r = await fetch('/api/fta/seed', { method: 'POST' });
    const d = await r.json();
    alert(`投入完了: 協定 ${d.added_agreements} 件、税率 ${d.added_rates} 件 追加`);
    loadAgreements();
  } catch(e) {
    alert('エラー: ' + e.message);
  }
}

// 初期ロード
loadAgreements();
{% endraw %}
</script>
</body>
</html>
