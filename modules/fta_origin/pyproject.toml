[project]
name = "module-fta-origin"
version = "0.1.0"
description = "EPA/FTA 特恵税率管理モジュール"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
platform-core = { workspace = true }
