[project]
name = "module-trade-gate"
version = "0.1.0"
description = "取引審査ゲートウェイモジュール（ERP 連携・AI 該非・スクリーニング統合）"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
platform-core = { workspace = true }
