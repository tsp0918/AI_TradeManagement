[project]
name = "module-dap"
version = "0.1.0"
description = "DAP / AIオーケストレーターモジュール (クロスモジュールエージェント)"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "httpx>=0.27",
    "anthropic>=0.40",  # Claude SDK for agent orchestration
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
platform-core = { workspace = true }
