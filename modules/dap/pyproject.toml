[project]
name = "module-dap"
version = "0.1.0"
description = "DAP / AIオーケストレーターモジュール (クロスモジュールエージェント)"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    # Agent orchestration
    "anthropic>=0.40",
    "httpx>=0.27",
    # Utils
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
platform-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
