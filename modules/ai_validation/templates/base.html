<!-- templates/base.html -->
<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}AI該非判定{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="module-header">
    <div class="module-brand">
      <span class="module-brand-icon">🔐</span>
      <span class="module-brand-name">AI該非判定</span>
    </div>
    <nav class="module-nav">
      <a class="module-nav-link{% block nav_transactions %} {% endblock %}" href="/ui/transactions">取引一覧</a>
      <a class="module-nav-link{% block nav_new %} {% endblock %}" href="/ui/transactions/new">新規審査</a>
    </nav>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
