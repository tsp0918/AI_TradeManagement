[project]
name = "module-ai-validation"
version = "0.1.0"
description = "AI該非判定モジュール (輸出管理・外為法)"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    # ML / NLP
    "sentence-transformers>=5.0",
    "faiss-cpu>=1.9",
    "torch>=2.2",
    "transformers>=4.50",
    "scikit-learn>=1.8",
    "numpy>=1.26",
    "huggingface-hub>=0.36",
    # Utils
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
platform-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
