{% extends "base.html" %}
{% block title %}ウォッチリスト - スクリーニング{% endblock %}
{% block nav_watchlist %} active{% endblock %}

{% block content %}
<div class="page-hd">
  <h1>ウォッチリスト</h1>
  <p>照合対象となる懸念エンティティのリストです。</p>
  <div style="margin-top:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;">
    <button id="sync-btn" onclick="syncSanctions('all')"
      style="background:#2563eb;color:#fff;border:none;padding:8px 18px;border-radius:6px;cursor:pointer;font-size:14px;">
      全制裁リスト同期（OFAC / BIS / EU / UK）
    </button>
    <button id="sync-ofac-btn" onclick="syncSanctions('ofac_sdn')"
      style="background:#374151;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;">
      OFAC のみ
    </button>
    <button id="sync-eu-btn" onclick="syncSanctions('eu_consolidated,uk_ofsi')"
      style="background:#374151;color:#fff;border:none;padding:6px 14px;border-radius:6px;cursor:pointer;font-size:13px;">
      EU / UK のみ
    </button>
    <span id="sync-status" class="muted" style="font-size:13px;"></span>
  </div>
</div>

<div class="card">
  <div class="flex items-center gap-3 mb-4">
    <input type="search" id="search-input" placeholder="エンティティ名で絞り込み…"
      style="max-width:340px;" oninput="filterRows()" />
    <span class="muted ml-auto" id="count-label"></span>
  </div>
  <table class="table">
    <thead>
      <tr>
        <th>エンティティ名</th>
        <th>リスト</th>
        <th>国</th>
        <th>リスクレベル</th>
        <th>ステータス</th>
      </tr>
    </thead>
    <tbody id="wl-tbody">
      <tr><td colspan="5" style="text-align:center;padding:24px;">
        <div class="empty-state"><div class="icon">⏳</div><p>読み込み中…</p></div>
      </td></tr>
    </tbody>
  </table>
</div>

<script>
let allRows = [];

const riskBadge = {
  high:   "badge-match",
  medium: "badge-possible",
  low:    "badge-clear",
};

async function load() {
  try {
    const res  = await fetch("/api/watchlist?limit=500");
    const data = await res.json();
    allRows = Array.isArray(data) ? data : (data.items || []);
    render(allRows);
  } catch (err) {
    console.error(err);
  }
}

function render(rows) {
  const tbody = document.getElementById("wl-tbody");
  document.getElementById("count-label").textContent = `${rows.length} 件`;
  if (!rows.length) {
    tbody.innerHTML = `<tr><td colspan="5">
      <div class="empty-state"><div class="icon">🛡️</div>
      <p>ウォッチリストにエントリがありません。</p></div>
    </td></tr>`;
    return;
  }
  tbody.innerHTML = rows.map(r => `<tr>
    <td><strong>${r.entity_name}</strong></td>
    <td>${r.list_source}</td>
    <td>${r.country || "—"}</td>
    <td><span class="badge ${riskBadge[r.risk_level] || 'badge-pending'}">${r.risk_level}</span></td>
    <td>${r.is_active ? '<span class="badge badge-clear">有効</span>' : '<span class="badge badge-pending">無効</span>'}</td>
  </tr>`).join("");
}

function filterRows() {
  const q = document.getElementById("search-input").value.toLowerCase();
  render(q ? allRows.filter(r => r.entity_name.toLowerCase().includes(q)) : allRows);
}

load();

async function syncSanctions(sources) {
  const btn = document.getElementById("sync-btn");
  const status = document.getElementById("sync-status");
  const allBtns = [btn,
    document.getElementById("sync-ofac-btn"),
    document.getElementById("sync-eu-btn")];
  allBtns.forEach(b => b && (b.disabled = true));
  btn.textContent = "同期中…";

  const msgs = {
    all: "OFAC/BIS/EU/UKを取得中（合計~20,000件、2〜3分かかります）",
    ofac_sdn: "OFAC SDN XML を取得中（~34MB）",
    "eu_consolidated,uk_ofsi": "EU / UK 制裁リストを取得中",
  };
  status.textContent = msgs[sources] || "制裁リストを取得中…";

  try {
    const params = new URLSearchParams({ sources });
    const res = await fetch(`/api/admin/sync-sanctions?${params}`, { method: "POST" });
    const data = await res.json();
    if (!res.ok) {
      status.textContent = "エラー: " + (data.detail || res.statusText);
    } else {
      const parts = [];
      const srcLabels = {
        ofac_sdn: "OFAC", bis_entity: "BIS-EL", bis_uvl: "BIS-UVL",
        bis_meu: "BIS-MEU", bis_dpl: "BIS-DPL",
        eu_consolidated: "EU", uk_ofsi: "UK"
      };
      for (const [key, label] of Object.entries(srcLabels)) {
        const n = data[`${key}_fetched`];
        if (n !== undefined) parts.push(`${label} ${n}件`);
      }
      status.textContent =
        `完了: ${parts.join(" / ")} → 挿入 ${data.total_inserted ?? "?"}件（FAISS: ${data.faiss_ntotal ?? "?"}件）`;
      await load();
    }
  } catch (err) {
    status.textContent = "通信エラー: " + err.message;
  } finally {
    allBtns.forEach(b => b && (b.disabled = false));
    btn.textContent = "全制裁リスト同期（OFAC / BIS / EU / UK）";
  }
}
</script>
{% endblock %}
