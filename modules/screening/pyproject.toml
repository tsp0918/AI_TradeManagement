[project]
name = "module-screening"
version = "0.1.0"
description = "懸念取引先スクリーニングモジュール (BIS/OFAC等)"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
platform-core = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
