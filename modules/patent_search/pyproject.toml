[project]
name = "module-patent-search"
version = "0.1.0"
description = "AI特許検索モジュール (Google Patents BigQuery + LLM)"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "google-cloud-bigquery>=3.0",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
platform-core = { workspace = true }
