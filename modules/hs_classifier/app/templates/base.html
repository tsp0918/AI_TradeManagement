<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}HSコード判定{% endblock %}</title>
  <style>
    :root {
      --primary:#2563eb; --primary-light:#eff6ff;
      --surface:#fff; --bg:#f8fafc; --border:#e5e7eb;
      --text:#111827; --muted:#6b7280;
      --radius:10px; --shadow:0 1px 4px rgba(0,0,0,.06);
    }
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
           background:var(--bg); color:var(--text); font-size:14px; }

    /* ── ヘッダー ── */
    .mod-header {
      background:var(--surface); border-bottom:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-between;
      padding:0 24px; height:52px; position:sticky; top:0; z-index:10;
    }
    .mod-brand { display:flex; align-items:center; gap:8px; font-weight:800; font-size:1rem; }
    .mod-brand-icon { font-size:1.3rem; }
    .mod-nav { display:flex; gap:2px; }
    .mod-nav-link {
      padding:6px 14px; border-radius:8px; font-size:.82rem; font-weight:600;
      color:var(--muted); text-decoration:none; transition:background .12s;
    }
    .mod-nav-link:hover { background:var(--bg); color:var(--text); }
    .mod-nav-link.active { background:var(--primary-light); color:var(--primary); }

    /* ── ページレイアウト ── */
    .page-wrap { max-width:900px; margin:0 auto; padding:24px 16px; }
    .page-hd { margin-bottom:16px; }
    .page-hd h1 { font-size:1.25rem; font-weight:800; margin:0 0 4px; }
    .page-hd p  { font-size:.84rem; color:var(--muted); margin:0; }

    /* ── カード ── */
    .card {
      background:var(--surface); border:1px solid var(--border);
      border-radius:var(--radius); padding:18px 20px; margin-bottom:14px;
      box-shadow:var(--shadow);
    }

    /* ── フォーム ── */
    .form-row { display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
    .label-sm { font-size:.82rem; font-weight:700; color:var(--muted); }
    .input, .textarea, .select {
      border:1px solid var(--border); border-radius:8px; padding:8px 10px;
      font-size:.9rem; font-family:inherit; width:100%;
      transition:border-color .15s;
    }
    .input:focus, .textarea:focus { outline:none; border-color:var(--primary); }
    .textarea { resize:vertical; }
    .hint { font-size:.75rem; color:var(--muted); margin-top:2px; }

    /* ── ボタン ── */
    .btn {
      display:inline-flex; align-items:center; justify-content:center; gap:6px;
      padding:8px 18px; border-radius:8px; font-size:.84rem; font-weight:700;
      cursor:pointer; border:1.5px solid var(--border); background:var(--surface);
      color:var(--text); text-decoration:none; transition:background .12s;
    }
    .btn:hover { background:var(--bg); }
    .btn-primary { background:var(--primary); color:#fff; border:none; }
    .btn-primary:hover { filter:brightness(1.1); }

    /* ── ステータスバナー ── */
    .status-banner {
      display:flex; align-items:flex-start; gap:12px;
      padding:12px 16px; border-radius:10px; border:1.5px solid transparent;
      margin-bottom:14px;
    }
    .status-banner.no-data  { background:#f3f4f6; border-color:#d1d5db; }
    .status-banner.has-data { background:#eff6ff; border-color:#bfdbfe; color:#1e40af; }
    .status-banner.error    { background:#fef2f2; border-color:#fecdd3; color:#991b1b; }
    .banner-icon { font-size:1.4rem; flex-shrink:0; }
    .banner-body { flex:1; }
    .banner-title { font-weight:800; font-size:.95rem; }
    .banner-sub   { font-size:.78rem; opacity:.8; margin-top:2px; }

    /* ── 結果テーブル ── */
    .result-table { width:100%; border-collapse:collapse; }
    .result-table th {
      background:#f8fafc; border-bottom:2px solid var(--border);
      padding:8px 10px; font-size:.72rem; font-weight:700; color:var(--muted);
      text-align:left;
    }
    .result-table td { padding:10px 10px; border-bottom:1px solid var(--border); vertical-align:top; }
    .result-table tr:last-child td { border-bottom:none; }
    .result-table tr:hover td { background:#f9fafb; }

    /* ── スコアバー ── */
    .score-wrap { display:flex; align-items:center; gap:6px; }
    .score-bar  { width:60px; height:7px; background:#e5e7eb; border-radius:4px; overflow:hidden; }
    .score-fill { height:100%; border-radius:4px; }
    .score-num  { font-size:.8rem; font-family:monospace; font-weight:700; }

    /* ── バッジ ── */
    .rank-badge {
      display:inline-flex; align-items:center; justify-content:center;
      width:24px; height:24px; border-radius:50%; font-size:.75rem; font-weight:800;
      background:var(--primary); color:#fff;
    }
    .chip {
      display:inline-block; padding:1px 7px; border-radius:999px;
      font-size:.72rem; font-weight:600; background:#f3f4f6; color:#374151;
    }

    /* ── ローディング ── */
    .spinner { width:20px; height:20px; border:2px solid #e5e7eb;
               border-top-color:var(--primary); border-radius:50%; animation:spin .6s linear infinite; }
    @keyframes spin { to { transform:rotate(360deg); } }

    .muted { color:var(--muted); }
    .mono  { font-family:monospace; }
  </style>
</head>
<body>
  <header class="mod-header">
    <div class="mod-brand">
      <span class="mod-brand-icon">📦</span>
      <span>HSコード判定</span>
    </div>
    <nav class="mod-nav">
      <a class="mod-nav-link{% block nav_search %} {% endblock %}" href="/ui">🔍 HSコード検索</a>
    </nav>
  </header>

  <div class="page-wrap">
    {% block content %}{% endblock %}
  </div>
  <script src="http://localhost:8010/static/chat-widget.js" defer></script>
</body>
</html>
