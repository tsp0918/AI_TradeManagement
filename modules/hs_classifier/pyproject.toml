[project]
name = "module-hs-classifier"
version = "0.1.0"
description = "HSコード判定モジュール (FAISS セマンティック検索)"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "sentence-transformers>=2.7",
    "faiss-cpu>=1.8",
    "numpy>=1.26",
    "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.uv.sources]
platform-core = { workspace = true }
