[project]
name = "module-rnd-assessment"
version = "0.1.0"
description = "R&Dリスク評価モジュール (知財・安全保障貿易管理)"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
platform-core = { workspace = true }
