[project]
name = "module-rnd-assessment"
version = "0.1.0"
description = "R&Dリスク評価モジュール (知財・安全保障貿易管理)"
requires-python = ">=3.11"
dependencies = [
    "platform-core",
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    # Utils
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    # Test
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
platform-core = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["app"]
