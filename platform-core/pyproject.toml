[project]
name = "platform-core"
version = "0.1.0"
description = "AI Trade Management - Shared Platform Core"
requires-python = ">=3.11"
dependencies = [
    # Web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    # DB
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",          # PostgreSQL async driver
    # Auth
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7",
    "httpx>=0.27",            # OAuth2 HTTP calls
    "authlib>=1.3",           # OAuth2 / SSO
    # Settings
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    # Utilities
    "pydantic[email]>=2.0",       # [email] で EmailStr に必要な email-validator を含む
    "python-multipart>=0.0.9",
    "psycopg2-binary>=2.9.11",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["platform_core"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
