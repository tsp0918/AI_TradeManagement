<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>グローバル規制レジーム照合</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Helvetica Neue', Arial, sans-serif; background: #0f172a; color: #e2e8f0; min-height: 100vh; }

  .container { max-width: 1100px; margin: 0 auto; padding: 24px 20px; }
  h1 { font-size: 1.5rem; font-weight: 700; color: #f8fafc; margin-bottom: 4px; }
  .subtitle { color: #94a3b8; font-size: 0.85rem; margin-bottom: 24px; }

  /* 入力フォーム */
  .search-card { background: #1e293b; border-radius: 12px; padding: 24px; margin-bottom: 24px; border: 1px solid #334155; }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1 / -1; }
  label { font-size: 0.75rem; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: 0.05em; }
  input, textarea { background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: #e2e8f0; padding: 10px 14px; font-size: 0.9rem; outline: none; transition: border-color 0.2s; }
  input:focus, textarea:focus { border-color: #6366f1; }
  textarea { resize: vertical; min-height: 80px; }
  .btn-check { background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff; border: none; padding: 10px 28px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; font-weight: 600; transition: opacity 0.2s; }
  .btn-check:hover { opacity: 0.9; }
  .btn-check:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 結果エリア */
  #result-area { display: none; }
  .result-header { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
  .risk-badge { padding: 6px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; }
  .risk-high   { background: #7f1d1d; color: #fca5a5; }
  .risk-medium { background: #78350f; color: #fcd34d; }
  .risk-none   { background: #14532d; color: #86efac; }

  /* レジームカード */
  .regime-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-bottom: 28px; }
  .regime-card { background: #1e293b; border-radius: 10px; padding: 18px; border-left: 4px solid; }
  .regime-card.itar    { border-color: #ef4444; }
  .regime-card.eu      { border-color: #3b82f6; }
  .regime-card.mtcr    { border-color: #f59e0b; }
  .regime-card.nsg     { border-color: #a78bfa; }
  .regime-card.ag      { border-color: #34d399; }
  .regime-name { font-size: 0.95rem; font-weight: 700; color: #f1f5f9; margin-bottom: 4px; }
  .regime-authority { font-size: 0.75rem; color: #94a3b8; margin-bottom: 10px; }
  .regime-cats { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .cat-tag { background: #0f172a; border: 1px solid #334155; border-radius: 4px; padding: 2px 8px; font-size: 0.75rem; color: #cbd5e1; }
  .regime-note { font-size: 0.78rem; color: #94a3b8; }

  /* USML / EU テーブルエリア */
  .ref-section { margin-bottom: 28px; }
  .ref-title { font-size: 1rem; font-weight: 600; color: #f1f5f9; margin-bottom: 12px; border-bottom: 1px solid #334155; padding-bottom: 8px; }
  .ref-table { width: 100%; border-collapse: collapse; font-size: 0.83rem; }
  .ref-table th { background: #1e293b; color: #94a3b8; padding: 8px 12px; text-align: left; border-bottom: 1px solid #334155; }
  .ref-table td { padding: 8px 12px; border-bottom: 1px solid #1e293b; color: #cbd5e1; }
  .ref-table tr:hover td { background: #1e293b44; }
  .eccn-tag { background: #1e293b; border: 1px solid #334155; border-radius: 3px; padding: 1px 6px; font-size: 0.72rem; color: #a5b4fc; margin: 1px; display: inline-block; }

  /* No-hit */
  .no-flag { background: #14532d22; border: 1px solid #166534; border-radius: 10px; padding: 20px; text-align: center; color: #86efac; font-weight: 600; }

  /* タブ */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid #334155; margin-bottom: 20px; }
  .tab-btn { background: none; border: none; padding: 8px 18px; color: #94a3b8; cursor: pointer; font-size: 0.85rem; border-bottom: 2px solid transparent; transition: all 0.15s; }
  .tab-btn.active { color: #a5b4fc; border-bottom-color: #6366f1; font-weight: 600; }
  .tab-pane { display: none; }
  .tab-pane.active { display: block; }

  .loading { text-align: center; color: #94a3b8; padding: 40px; }
</style>
</head>
<body>
<div class="container">
  <h1>🌐 グローバル規制レジーム照合</h1>
  <p class="subtitle">品目の ITAR/USML・EU Dual-Use・MTCR・NSG・AG 適用規制を一括確認</p>

  <!-- 入力フォーム -->
  <div class="search-card">
    <div class="form-row">
      <div class="form-group">
        <label>品目名 *</label>
        <input type="text" id="item-name" placeholder="例: GaN HEMT Power Amplifier" />
      </div>
      <div class="form-group">
        <label>ECCN（任意）</label>
        <input type="text" id="eccn" placeholder="例: 3A001" style="text-transform:uppercase" />
      </div>
    </div>
    <div class="form-group full" style="margin-bottom:16px">
      <label>技術説明（任意）</label>
      <textarea id="description" placeholder="例: High frequency gallium nitride transistor for radar and communication applications"></textarea>
    </div>
    <button class="btn-check" id="check-btn" onclick="runCheck()">🔍 規制レジーム照合</button>
  </div>

  <!-- 照合結果 -->
  <div id="result-area">
    <div class="result-header">
      <div>
        <div style="font-size:0.85rem;color:#94a3b8;margin-bottom:2px;" id="result-item-name"></div>
        <div style="font-size:1.1rem;font-weight:600;color:#f1f5f9;" id="result-summary"></div>
      </div>
      <div class="risk-badge" id="risk-badge"></div>
    </div>

    <!-- レジームカード -->
    <div id="regime-cards" class="regime-grid"></div>

    <!-- タブ: USML / EU Dual-Use 参照 -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('usml')">📋 USML/ITAR 全カテゴリ</button>
      <button class="tab-btn" onclick="switchTab('eu')">🇪🇺 EU Dual-Use 全カテゴリ</button>
    </div>
    <div id="tab-usml" class="tab-pane active">
      <div class="ref-section">
        <div id="usml-table-container" class="loading">読み込み中…</div>
      </div>
    </div>
    <div id="tab-eu" class="tab-pane">
      <div class="ref-section">
        <div id="eu-table-container" class="loading">読み込み中…</div>
      </div>
    </div>
  </div>

  <!-- 初期表示: USML/EU テーブル -->
  <div id="ref-area">
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTabRef('usml')">📋 USML/ITAR 一覧</button>
      <button class="tab-btn" onclick="switchTabRef('eu')">🇪🇺 EU Dual-Use 一覧</button>
    </div>
    <div id="ref-tab-usml" class="tab-pane active">
      <div id="usml-ref-container" class="loading">読み込み中…</div>
    </div>
    <div id="ref-tab-eu" class="tab-pane">
      <div id="eu-ref-container" class="loading">読み込み中…</div>
    </div>
  </div>
</div>

<script>
const REGIME_COLORS = {
  "ITAR/USML": "itar",
  "EU Dual-Use (2021/821)": "eu",
  "MTCR": "mtcr",
  "NSG (Nuclear Suppliers Group)": "nsg",
  "Australia Group (AG)": "ag",
};

function regimeClass(name) {
  for (const [key, cls] of Object.entries(REGIME_COLORS)) {
    if (name.includes(key.split(" ")[0])) return cls;
  }
  return "mtcr";
}

async function runCheck() {
  const name = document.getElementById("item-name").value.trim();
  if (!name) { alert("品目名を入力してください"); return; }
  const btn = document.getElementById("check-btn");
  btn.disabled = true;
  btn.textContent = "照合中…";

  try {
    const res = await fetch("/api/regulatory/regime-check", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        item_name:   name,
        description: document.getElementById("description").value,
        eccn:        document.getElementById("eccn").value.trim().toUpperCase() || null,
      }),
    });
    const data = await res.json();

    document.getElementById("ref-area").style.display = "none";
    const ra = document.getElementById("result-area");
    ra.style.display = "block";

    document.getElementById("result-item-name").textContent = `品目: ${data.item_name}${data.eccn ? " | ECCN: " + data.eccn : ""}`;
    document.getElementById("result-summary").textContent =
      data.total_flags > 0
        ? `${data.total_flags} 件の規制レジームが適用される可能性があります`
        : "特定の規制レジームは検出されませんでした";

    const badge = document.getElementById("risk-badge");
    badge.className = "risk-badge risk-" + data.risk_level;
    badge.textContent = { high: "要注意", medium: "確認", none: "クリア" }[data.risk_level] || data.risk_level;

    // レジームカード
    const cardsDiv = document.getElementById("regime-cards");
    if (!data.applicable_regimes.length) {
      cardsDiv.innerHTML = `<div class="no-flag">✅ 主要規制レジームへの該当は検出されませんでした。<br><small>EAR/外為法での品目分類確認も忘れずに実施してください。</small></div>`;
    } else {
      cardsDiv.innerHTML = data.applicable_regimes.map(r => `
        <div class="regime-card ${regimeClass(r.regime)}">
          <div class="regime-name">${r.regime}</div>
          <div class="regime-authority">${r.authority}</div>
          ${r.categories ? `<div class="regime-cats">${r.categories.map(c => `<span class="cat-tag">Cat. ${c}</span>`).join("")}</div>` : ""}
          ${r.note ? `<div class="regime-note">⚠️ ${r.note}</div>` : ""}
        </div>
      `).join("");
    }

    // テーブルロード
    loadUsmlTable("usml-table-container");
    loadEuTable("eu-table-container");
  } finally {
    btn.disabled = false;
    btn.textContent = "🔍 規制レジーム照合";
  }
}

async function loadUsmlTable(containerId) {
  try {
    const res = await fetch("/api/regulatory/usml");
    const data = await res.json();
    const el = document.getElementById(containerId);
    el.innerHTML = `
      <table class="ref-table">
        <thead><tr><th>カテゴリ</th><th>名称</th><th>関連ECCN</th><th>外為法</th></tr></thead>
        <tbody>${data.categories.map(c => `
          <tr>
            <td><strong>Cat. ${c.category}</strong></td>
            <td>${c.title}</td>
            <td>${(c.related_eccn || []).map(e => `<span class="eccn-tag">${e}</span>`).join("")}</td>
            <td>${c.fefta || "—"}</td>
          </tr>`).join("")}</tbody>
      </table>`;
  } catch(e) {
    document.getElementById(containerId).innerHTML = `<div class="loading">エラー: ${e.message}</div>`;
  }
}

async function loadEuTable(containerId) {
  try {
    const res = await fetch("/api/regulatory/eu-dual-use");
    const data = await res.json();
    const el = document.getElementById(containerId);
    el.innerHTML = `
      <table class="ref-table">
        <thead><tr><th>カテゴリ</th><th>名称</th><th>対応ECCN</th><th>外為法</th></tr></thead>
        <tbody>${data.categories.map(c => `
          <tr>
            <td><strong>Cat. ${c.category}</strong></td>
            <td>${c.title}</td>
            <td>${(c.eccn_parallel || []).slice(0, 5).map(e => `<span class="eccn-tag">${e}</span>`).join("")}</td>
            <td>${c.fefta || "—"}</td>
          </tr>`).join("")}</tbody>
      </table>`;
  } catch(e) {
    document.getElementById(containerId).innerHTML = `<div class="loading">エラー: ${e.message}</div>`;
  }
}

function switchTab(name) {
  document.querySelectorAll("#result-area .tab-btn").forEach(b => b.classList.toggle("active", b.textContent.toLowerCase().includes(name)));
  document.querySelectorAll("#result-area .tab-pane").forEach(p => {
    p.classList.toggle("active", p.id === `tab-${name}`);
  });
}

function switchTabRef(name) {
  document.querySelectorAll("#ref-area .tab-btn").forEach(b => b.classList.toggle("active", b.onclick.toString().includes(name)));
  document.querySelectorAll("#ref-area .tab-pane").forEach(p => {
    p.classList.toggle("active", p.id === `ref-tab-${name}`);
  });
}

// 初期ロード: USML/EU テーブルを表示
loadUsmlTable("usml-ref-container");
loadEuTable("eu-ref-container");
</script>
</body>
</html>
