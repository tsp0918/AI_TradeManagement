<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>申告受付完了 — AI Trade Management</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f4f8;
      color: #1a202c;
      min-height: 100vh;
    }
    header {
      background: #1a56db;
      color: #fff;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    header .logo { font-size: 1.1rem; font-weight: 700; }
    .container {
      max-width: 520px;
      margin: 48px auto;
      padding: 0 16px;
    }
    .check-icon {
      text-align: center;
      font-size: 3.5rem;
      margin-bottom: 16px;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      padding: 32px 28px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
      border-top: 4px solid #10b981;
    }
    .card h1 { font-size: 1.25rem; color: #059669; margin-bottom: 8px; }
    .card .subtitle { font-size: .9rem; color: #6b7280; margin-bottom: 24px; }
    .detail-row {
      display: flex;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #f3f4f6;
      font-size: .9rem;
    }
    .detail-row:last-of-type { border-bottom: none; }
    .dl { color: #6b7280; min-width: 140px; flex-shrink: 0; }
    .dv { color: #111827; font-weight: 500; word-break: break-all; }
    .ref-box {
      margin-top: 20px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 12px 16px;
      font-size: .82rem;
      color: #065f46;
    }
    .ref-box strong { display: block; margin-bottom: 4px; }
    .ref-id { font-family: monospace; font-size: .85rem; color: #374151; }
    .footer { font-size: .78rem; color: #9ca3af; margin-top: 24px; text-align: center; }
  </style>
</head>
<body>
<header>
  <span class="logo">AI Trade Management</span>
</header>
<div class="container">
  <div class="check-icon">&#x2705;</div>
  <div class="card">
    <h1>申告が受け付けられました</h1>
    <p class="subtitle">以下の内容でサプライヤー申告が登録されました。担当者が内容を確認いたします。</p>

    <div class="detail-row"><span class="dl">サプライヤー名</span><span class="dv">{{ supplier_name }}</span></div>
    <div class="detail-row"><span class="dl">申告対象品目</span><span class="dv">{{ node_name }}</span></div>
    <div class="detail-row"><span class="dl">申告 ECCN</span><span class="dv">{{ claimed_eccn }}</span></div>
    <div class="detail-row"><span class="dl">申告原産国</span><span class="dv">{{ claimed_country }}</span></div>

    <div class="ref-box">
      <strong>受付番号（お問い合わせ時にご提示ください）</strong>
      <span class="ref-id">{{ attestation_id }}</span>
    </div>
  </div>
  <div class="footer">
    ご申告いただきありがとうございます。内容に変更が必要な場合は、発行元担当者にご連絡ください。
  </div>
</div>
</body>
</html>
