<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>取引審査キュー — AI Trade Management</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f0f2f5; color: #1a1a2e; }
  .topbar { background: #1a1a2e; color: #fff; padding: 12px 24px; display: flex; align-items: center; gap: 16px; }
  .topbar h1 { font-size: 1.1rem; font-weight: 600; }
  .container { max-width: 1400px; margin: 24px auto; padding: 0 20px; }
  .stats-row { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: #fff; border-radius: 10px; padding: 16px 20px; box-shadow: 0 1px 4px rgba(0,0,0,.08); }
  .stat-card .val { font-size: 2rem; font-weight: 700; }
  .stat-card .lbl { font-size: 0.78rem; color: #666; margin-top: 4px; }
  .stat-card.warn .val  { color: #e65100; }
  .stat-card.ok .val    { color: #2e7d32; }
  .stat-card.pend .val  { color: #1976d2; }
  .toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
  .toolbar input, .toolbar select { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
  .toolbar input { flex: 1; min-width: 200px; }
  .btn { padding: 8px 18px; border: none; border-radius: 6px; cursor: pointer; font-size: 0.88rem; font-weight: 500; }
  .btn-primary { background: #1976d2; color: #fff; }
  .btn-primary:hover { background: #1565c0; }
  .btn-success { background: #2e7d32; color: #fff; }
  .btn-success:hover { background: #1b5e20; }
  .btn-ghost { background: #f0f0f0; color: #333; }
  .btn-ghost:hover { background: #e0e0e0; }
  .btn-sm { padding: 4px 10px; font-size: 0.8rem; border-radius: 4px; }
  .card { background: #fff; border-radius: 10px; box-shadow: 0 1px 4px rgba(0,0,0,.08); overflow: hidden; margin-bottom: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 0.88rem; }
  th { background: #f8f8f8; font-weight: 600; padding: 10px 12px; text-align: left; border-bottom: 2px solid #e8e8e8; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
  tr:hover td { background: #fafafa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 0.75rem; font-weight: 600; white-space: nowrap; }
  .badge-approved   { background: #e8f5e9; color: #2e7d32; }
  .badge-rejected   { background: #ffebee; color: #c62828; }
  .badge-needs      { background: #fff3e0; color: #e65100; }
  .badge-pending    { background: #e3f2fd; color: #1565c0; }
  .badge-auto       { background: #f3e5f5; color: #6a1b9a; }
  .badge-manual     { background: #e8f5e9; color: #1b5e20; }
  .empty { text-align: center; padding: 40px; color: #999; }
  /* modal */
  .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 100; align-items: center; justify-content: center; }
  .overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 12px; width: 600px; max-width: 95vw; max-height: 85vh; overflow-y: auto; padding: 24px; }
  .modal h3 { margin-bottom: 16px; font-size: 1.05rem; }
  .modal-footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; border-top: 1px solid #eee; padding-top: 16px; }
  .field-group { margin-bottom: 14px; }
  .field-group label { display: block; font-size: 0.82rem; color: #666; margin-bottom: 4px; }
  .field-group input, .field-group textarea { width: 100%; padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 0.9rem; }
  .detail-row { display: flex; gap: 8px; margin-bottom: 8px; font-size: 0.88rem; }
  .detail-row .dk { color: #888; width: 140px; flex-shrink: 0; }
  .detail-row .dv { flex: 1; word-break: break-all; }
</style>
</head>
<body>
<div class="topbar">
  <span>📝</span>
  <h1>取引審査キュー — ERP 連携輸出審査管理</h1>
</div>

<div class="container">

  <!-- Stats -->
  <div class="stats-row" id="statsRow">
    <div class="stat-card pend"><div class="val" id="sTot">—</div><div class="lbl">審査総数</div></div>
    <div class="stat-card ok">  <div class="val" id="sApproved">—</div><div class="lbl">承認済み</div></div>
    <div class="stat-card warn"><div class="val" id="sNeeds">—</div><div class="lbl">手動確認待ち</div></div>
    <div class="stat-card pend"><div class="val" id="sPend">—</div><div class="lbl">審査中</div></div>
  </div>

  <!-- Filter toolbar -->
  <div class="toolbar">
    <input type="text" id="qSearch" placeholder="取引伝票番号・品目コード・取引先で検索..." oninput="debounceLoad()">
    <select id="fJudgment" onchange="loadReviews()">
      <option value="">全判定</option>
      <option value="APPROVED">APPROVED</option>
      <option value="NEEDS_REVIEW">NEEDS_REVIEW</option>
      <option value="REJECTED">REJECTED</option>
      <option value="PENDING">PENDING</option>
    </select>
    <select id="fApproved" onchange="loadReviews()">
      <option value="">全ステータス</option>
      <option value="true">出荷 OK</option>
      <option value="false">未承認</option>
    </select>
    <button class="btn btn-ghost" onclick="loadAll()">🔄 更新</button>
  </div>

  <!-- Table -->
  <div class="card">
    <table>
      <thead><tr>
        <th>取引伝票 ID</th>
        <th>品目コード</th>
        <th>品目名</th>
        <th>取引先</th>
        <th>仕向地</th>
        <th>ECCN</th>
        <th>判定</th>
        <th>審査種別</th>
        <th>出荷 OK</th>
        <th>登録日</th>
        <th>操作</th>
      </tr></thead>
      <tbody id="reviewsBody"><tr><td colspan="11" class="empty">読み込み中…</td></tr></tbody>
    </table>
  </div>

</div><!-- /container -->

<!-- 詳細・手動承認モーダル -->
<div class="overlay" id="detailOverlay">
  <div class="modal">
    <h3>📝 審査詳細</h3>
    <div id="detailBody"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('detailOverlay')">閉じる</button>
      <button class="btn btn-success" id="btnManualApprove" onclick="openApproveModal()" style="display:none;">
        ✓ 手動承認する
      </button>
    </div>
  </div>
</div>

<!-- 手動承認入力モーダル -->
<div class="overlay" id="approveOverlay">
  <div class="modal" style="width:440px;">
    <h3>✓ 手動承認</h3>
    <p style="color:#666;font-size:.88rem;margin-bottom:16px;">この取引審査を承認します。担当者名を入力してください。</p>
    <div class="field-group">
      <label>担当者名 *</label>
      <input type="text" id="approveBy" placeholder="例: 山田 太郎">
    </div>
    <div class="field-group">
      <label>備考</label>
      <textarea id="approveNotes" rows="3" placeholder="承認理由・条件等"></textarea>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal('approveOverlay')">キャンセル</button>
      <button class="btn btn-success" onclick="submitManualApprove()">承認する</button>
    </div>
  </div>
</div>

<script>
let _currentReviewId = null;
let _debTimer = null;

// ── データ取得 ──────────────────────────────────────────────────
async function loadStats() {
  try {
    const r = await fetch('/api/transaction-reviews/stats');
    const d = await r.json();
    document.getElementById('sTot').textContent      = d.total ?? '—';
    document.getElementById('sApproved').textContent = d.approved ?? '—';
    document.getElementById('sNeeds').textContent    = d.needs_manual_review ?? '—';
    document.getElementById('sPend').textContent     = d.pending ?? '—';
  } catch(e) { console.error(e); }
}

async function loadReviews() {
  const q        = document.getElementById('qSearch').value.trim();
  const judgment = document.getElementById('fJudgment').value;
  const approved = document.getElementById('fApproved').value;

  let url = '/api/transaction-reviews?limit=100';
  if (q)        url += `&q=${encodeURIComponent(q)}`;
  if (judgment) url += `&judgment=${judgment}`;
  if (approved) url += `&approved=${approved}`;

  const tbody = document.getElementById('reviewsBody');
  tbody.innerHTML = '<tr><td colspan="11" class="empty">読み込み中…</td></tr>';
  try {
    const r = await fetch(url);
    const rows = await r.json();
    if (!rows.length) {
      tbody.innerHTML = '<tr><td colspan="11" class="empty">該当する審査レコードがありません</td></tr>';
      return;
    }
    tbody.innerHTML = rows.map(r => `
      <tr>
        <td style="font-family:monospace;font-size:.82rem;">${esc(r.erp_transaction_id||'—')}</td>
        <td style="font-family:monospace;">${esc(r.item_code||'—')}</td>
        <td>${esc(r.item_name||'—')}</td>
        <td>${esc(r.company_name||'—')}</td>
        <td>${esc(r.destination_country||'—')}</td>
        <td>${esc(r.eccn||'—')}</td>
        <td>${judgmentBadge(r.judgment)}</td>
        <td>${levelBadge(r.review_level)}</td>
        <td>${r.approved
          ? '<span style="color:#2e7d32;font-weight:600;">✓ OK</span>'
          : '<span style="color:#999;">—</span>'}</td>
        <td style="font-size:.8rem;color:#888;">${fmtDate(r.created_at)}</td>
        <td><button class="btn btn-ghost btn-sm" onclick="openDetail('${r.id}')">詳細</button></td>
      </tr>`).join('');
  } catch(e) {
    tbody.innerHTML = `<tr><td colspan="11" class="empty" style="color:#c62828;">取得エラー: ${e}</td></tr>`;
  }
}

function loadAll() { loadStats(); loadReviews(); }
function debounceLoad() {
  clearTimeout(_debTimer);
  _debTimer = setTimeout(loadReviews, 250);
}

// ── 詳細モーダル ──────────────────────────────────────────────
async function openDetail(id) {
  _currentReviewId = id;
  document.getElementById('detailBody').innerHTML = '<p style="color:#999;">読み込み中…</p>';
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('btnManualApprove').style.display = 'none';
  try {
    const r = await fetch(`/api/transaction-reviews/${id}`);
    const d = await r.json();
    let html = '';
    const fields = [
      ['ID', d.id], ['ERP 取引伝票', d.erp_transaction_id], ['ERP 出荷伝票', d.erp_shipment_id],
      ['品目コード', d.item_code], ['品目名', d.item_name],
      ['取引先', d.company_name], ['仕向地', d.destination_country], ['ECCN', d.eccn],
      ['判定', d.judgment], ['審査種別', d.review_level],
      ['審査完了', d.review_completed ? 'Yes' : 'No'],
      ['出荷 OK', d.approved ? 'Yes' : 'No'],
      ['再スクリーニング変化', d.rescreen_changed ? 'あり ⚠' : 'なし'],
      ['承認者', d.reviewed_by], ['承認日時', fmtDate(d.reviewed_at)],
      ['有効期限', fmtDate(d.expires_at)], ['備考', d.notes],
    ];
    for (const [k, v] of fields) {
      html += `<div class="detail-row"><span class="dk">${k}</span><span class="dv">${esc(v??'—')}</span></div>`;
    }
    if (d.screening_snapshot) {
      html += `<details style="margin-top:12px;font-size:.82rem;">
        <summary style="cursor:pointer;color:#1976d2;">スクリーニング結果</summary>
        <pre style="margin-top:8px;background:#f5f5f5;padding:10px;border-radius:6px;overflow:auto;max-height:200px;">${esc(JSON.stringify(d.screening_snapshot, null, 2))}</pre>
      </details>`;
    }
    document.getElementById('detailBody').innerHTML = html;
    if (d.judgment === 'NEEDS_REVIEW' && !d.approved) {
      document.getElementById('btnManualApprove').style.display = 'inline-block';
    }
  } catch(e) {
    document.getElementById('detailBody').innerHTML = `<p style="color:#c62828;">取得エラー: ${e}</p>`;
  }
}

// ── 手動承認 ──────────────────────────────────────────────────
function openApproveModal() {
  document.getElementById('approveBy').value = '';
  document.getElementById('approveNotes').value = '';
  document.getElementById('approveOverlay').classList.add('open');
}

async function submitManualApprove() {
  const by    = document.getElementById('approveBy').value.trim();
  const notes = document.getElementById('approveNotes').value.trim();
  if (!by) { alert('担当者名を入力してください'); return; }
  try {
    const r = await fetch(`/api/transaction-reviews/${_currentReviewId}/manual-approve`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ reviewed_by: by, notes: notes || null }),
    });
    if (!r.ok) throw new Error(await r.text());
    closeModal('approveOverlay');
    closeModal('detailOverlay');
    loadAll();
    alert('承認しました。ERP への通知は自動的に送信されます。');
  } catch(e) {
    alert(`承認に失敗しました: ${e}`);
  }
}

// ── ユーティリティ ────────────────────────────────────────────
function esc(v) {
  if (v == null) return '—';
  return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function fmtDate(s) {
  if (!s) return '—';
  return new Date(s).toLocaleString('ja-JP', { year:'numeric', month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function judgmentBadge(j) {
  const m = { APPROVED:'badge-approved', REJECTED:'badge-rejected', NEEDS_REVIEW:'badge-needs', PENDING:'badge-pending' };
  return `<span class="badge ${m[j]||'badge-pending'}">${j||'—'}</span>`;
}
function levelBadge(l) {
  return l === 'MANUAL'
    ? '<span class="badge badge-manual">MANUAL</span>'
    : '<span class="badge badge-auto">AUTO</span>';
}
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
document.querySelectorAll('.overlay').forEach(el => {
  el.addEventListener('click', e => { if (e.target === el) el.classList.remove('open'); });
});

// ── 初期表示 ──────────────────────────────────────────────────
loadAll();
</script>
</body>
</html>
